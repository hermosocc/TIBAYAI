<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Applicants - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4">
	<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
		<div>
			<h3 class="fw-bold mb-0" th:text="${job.title}">Job</h3>
			<div class="text-muted">
				<span th:text="${job.specialization}">Spec</span>
				<span class="mx-1">•</span>₱<span th:text="${job.budgetPhp}">0</span>
				<span class="mx-1">•</span><span class="badge bg-secondary" th:text="${job.status}">OPEN</span>
			</div>
		</div>
		<div class="d-flex gap-2">
			<a class="btn btn-outline-dark" th:href="@{/client/dashboard}">Back</a>
		</div>
	</div>

	<div class="row g-3">
		<div class="col-lg-5">
			<div class="card shadow-sm">
				<div class="card-body">
					<div class="small text-muted">Job Description</div>
					<div class="small" style="white-space: pre-wrap;" th:text="${job.description}"></div>
					<hr class="my-3">
					<div class="small text-muted">Location</div>
					<div class="fw-semibold">
						<span th:text="${job.barangay}">Barangay</span><span th:text="${job.city != null ? ', ' + job.city : ''}"></span>
					</div>
					<div class="small text-muted mt-2" th:if="${job.deadline != null}">
						Deadline: <span th:text="${job.deadline}"></span>
					</div>
				</div>
			</div>
		</div>
		<div class="col-lg-7">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5 class="fw-semibold mb-2">Applicants</h5>
					<div class="row g-3">
						<div class="col-12" th:if="${#lists.isEmpty(applications)}">
							<div class="alert alert-info mb-0">No applicants yet.</div>
						</div>
						<div class="col-md-6" th:each="a : ${applications}">
							<div class="card border h-100">
								<div class="card-body">
									<div class="d-flex gap-2 align-items-center">
										<img class="rounded-circle border" style="width:54px;height:54px;object-fit:cover;"
											 th:if="${a.workerProfile.selfiePath != null}" th:src="@{'/uploads/' + ${a.workerProfile.selfiePath}}">
										<div>
											<div class="fw-semibold" th:text="${a.workerProfile.fullName}">Name</div>
											<div class="small text-muted">
												Skill Score: <span class="fw-semibold" th:text="${a.workerProfile.latestSkillScore != null ? a.workerProfile.latestSkillScore : '--'}">--</span>
											</div>
											<div class="small">
												<span class="badge bg-primary" th:text="${a.status}">APPLIED</span>
											</div>
										</div>
									</div>
									<div class="small text-muted mt-2" th:if="${a.coverNote != null}" th:text="${#strings.abbreviate(a.coverNote, 140)}"></div>
									<div class="d-flex gap-2 mt-3">
										<a class="btn btn-outline-dark btn-sm" th:href="@{/client/workers/{id}(id=${a.workerProfile.id})}">View Profile</a>
										<form method="post" th:action="@{/client/jobs/{jobId}/hire(jobId=${job.id})}">
											<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
											<input type="hidden" name="applicationId" th:value="${a.id}">
											<button class="btn btn-dark btn-sm" type="submit" th:disabled="${job.status.name() == 'CLOSED'}">Hire</button>
										</form>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Portfolio Generator - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 980px;">
	<div class="d-flex justify-content-between align-items-end mb-3">
		<div>
			<h3 class="fw-bold mb-0">ATS Portfolio Generator</h3>
			<div class="text-muted">Convert Tagalog/Taglish into recruiter-ready English for welding roles.</div>
		</div>
		<a class="btn btn-outline-dark" th:href="@{/worker/profile}">Back</a>
	</div>

	<div class="row g-3">
		<div class="col-lg-6">
			<div class="card shadow-sm">
				<div class="card-body">
					<form method="post" th:object="${form}">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<label class="form-label">Describe your work (Tagalog/Taglish is OK)</label>
						<textarea class="form-control" rows="10" th:field="*{rawText}"
								  placeholder="Example: Taga-ayos ako ng lamat sa barko. Nasa pier ako lagi nagwewelding."></textarea>
						<div class="text-danger small" th:if="${#fields.hasErrors('rawText')}" th:errors="*{rawText}"></div>
						<button class="btn btn-dark mt-3" type="submit">Generate Portfolio</button>
					</form>
				</div>
			</div>
			<div class="alert alert-info mt-3">
				This is an AI-assisted writing tool for hiring visibility. It does not claim certification or official worker verification.
			</div>
		</div>
		<div class="col-lg-6">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5 class="fw-semibold">Generated Output</h5>
					<div class="text-muted" th:if="${worker.atsPortfolio == null and !portfolioGenerated}">No portfolio yet.</div>
					<pre class="mb-0" th:if="${portfolio != null}" th:text="${portfolio}" style="white-space: pre-wrap;"></pre>
					<pre class="mb-0" th:if="${portfolio == null and worker.atsPortfolio != null}" th:text="${worker.atsPortfolio}" style="white-space: pre-wrap;"></pre>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>

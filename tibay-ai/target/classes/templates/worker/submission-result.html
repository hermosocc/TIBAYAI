<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Assessment Result - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 980px;">
	<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
		<div>
			<h3 class="fw-bold mb-0">AI Assessment Result</h3>
			<div class="text-muted">Preliminary evaluation (not a certification).</div>
		</div>
		<div class="d-flex gap-2">
			<a class="btn btn-outline-dark" th:href="@{/worker/submission}">Upload Again</a>
			<a class="btn btn-dark" th:href="@{/worker/profile}">Back to Profile</a>
		</div>
	</div>

	<div class="row g-3">
		<div class="col-lg-4">
			<div class="card shadow-sm h-100">
				<div class="card-body">
					<div class="small text-muted">Skill Score</div>
					<div class="display-5 fw-bold" th:text="${assessment.skillScore != null ? assessment.skillScore : '--'}">--</div>
					<hr class="my-3">
					<div class="small text-muted">Authenticity</div>
					<div class="fw-semibold" th:text="${assessment.authenticityStatus}">PENDING</div>
					<div class="small text-muted" th:text="${assessment.authenticitySummary}"></div>
					<hr class="my-3">
					<div class="small text-muted">Media</div>
					<div class="small">
						<span class="fw-semibold" th:text="${submission.mediaType}">IMAGE</span>
						<span class="text-muted">•</span>
						<span th:text="${#temporals.format(submission.submittedAt, 'yyyy-MM-dd HH:mm')}"></span>
					</div>
				</div>
			</div>
		</div>
		<div class="col-lg-8">
			<div class="card shadow-sm h-100">
				<div class="card-body">
					<div class="small text-muted">Assessment Summary</div>
					<div class="small" style="white-space: pre-wrap;" th:text="${assessment.assessmentSummary}"></div>
					<hr class="my-3">
					<div class="small text-muted">Recommendations</div>
					<div class="small" style="white-space: pre-wrap;" th:text="${assessment.recommendations}"></div>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>

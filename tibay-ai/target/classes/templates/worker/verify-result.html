<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Verification Result - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 880px;">
	<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
		<div>
			<h3 class="fw-bold mb-0">Verification Result</h3>
			<div class="text-muted">AI-assisted screening result (not a legal verification).</div>
		</div>
		<div class="d-flex gap-2">
			<a class="btn btn-outline-dark" th:href="@{/worker/verify}">Try Again</a>
			<a class="btn btn-dark" th:href="@{/worker/profile}">Back to Profile</a>
		</div>
	</div>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="d-flex justify-content-between align-items-center">
				<div>
					<div class="small text-muted">Status</div>
					<div class="d-flex align-items-center gap-2">
						<div class="fw-semibold" th:text="${verification.status}">PENDING</div>
						<span class="badge"
							  th:classappend="${verification.status.name() == 'VERIFIED'} ? ' bg-success' : (${verification.status.name() == 'FAILED'} ? ' bg-danger' : ' bg-warning text-dark')"
							  th:text="${verification.status}">PENDING</span>
					</div>
				</div>
				<div th:if="${verification.faceMatchScore != null}">
					<div class="small text-muted text-end">Face Match Score</div>
					<div class="fw-semibold text-end" th:text="${verification.faceMatchScore + '/100'}">0/100</div>
				</div>
			</div>
			<hr class="my-3">
			<div class="small text-muted">Summary</div>
			<div class="small" style="white-space: pre-wrap;" th:text="${verification.summary}"></div>
			<div class="alert alert-danger mt-3 mb-0" th:if="${verification.status.name() == 'FAILED'}">
				Verification failed. Please re-upload clear images (good lighting, readable ID text, and visible face) and try again.
			</div>
		</div>
	</div>
</main>
</body>
</html>

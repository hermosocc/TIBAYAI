spring.application.name=TibayAI

spring.datasource.url=jdbc:h2:mem:tibay;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

tibay.upload-dir=./uploads
tibay.seed-demo=true
tibay.openrouter-api-key=${OPENROUTER_API_KEY:}
tibay.openrouter-model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
tibay.ocr-space-api-key=${OCR_SPACE_API_KEY:}
tibay.roboflow-api-key=${ROBOFLOW_API_KEY:}
tibay.roboflow-ppe-model-url=${ROBOFLOW_PPE_MODEL_URL:}
tibay.roboflow-face-model-url=${ROBOFLOW_FACE_MODEL_URL:}

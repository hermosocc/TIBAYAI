<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Edit Job - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 980px;">
	<div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
		<div>
			<h3 class="fw-bold mb-0">Edit Job Post</h3>
			<div class="text-muted">Update details to keep applicants aligned with your needs.</div>
		</div>
		<div class="d-flex gap-2">
			<a class="btn btn-outline-dark" th:href="@{/client/jobs/{id}(id=${job.id})}">Back</a>
		</div>
	</div>

	<div class="card shadow-sm">
		<div class="card-body">
			<form method="post" th:object="${form}" th:action="@{/client/jobs/{id}/edit(id=${job.id})}">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label">Job Title</label>
						<input class="form-control" th:field="*{title}" required>
						<div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Specialization</label>
						<input class="form-control" th:field="*{specialization}" required>
						<div class="text-danger small" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></div>
					</div>
					<div class="col-12">
						<label class="form-label">Job Description</label>
						<textarea class="form-control" rows="6" th:field="*{description}" required></textarea>
						<div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
					</div>
					<div class="col-md-4">
						<label class="form-label">Budget (PHP)</label>
						<input class="form-control" type="number" th:field="*{budgetPhp}" required>
						<div class="text-danger small" th:if="${#fields.hasErrors('budgetPhp')}" th:errors="*{budgetPhp}"></div>
					</div>
					<div class="col-md-4">
						<label class="form-label">Deadline</label>
						<input class="form-control" type="date" th:field="*{deadline}">
					</div>
					<div class="col-md-4">
						<label class="form-label">City</label>
						<input class="form-control" th:field="*{city}" placeholder="Cebu City">
					</div>
					<div class="col-md-6">
						<label class="form-label">Barangay</label>
						<input class="form-control" th:field="*{barangay}" placeholder="Barangay San Roque">
					</div>
				</div>
				<div class="d-flex flex-wrap gap-2 mt-3">
					<button class="btn btn-dark" type="submit">Save Changes</button>
					<a class="btn btn-outline-dark" th:href="@{/client/jobs/{id}(id=${job.id})}">Cancel</a>
				</div>
			</form>
		</div>
	</div>
</main>
</body>
</html>

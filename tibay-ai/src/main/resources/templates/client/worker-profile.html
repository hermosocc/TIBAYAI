<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Worker - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 980px;">
	<div class="d-flex justify-content-between align-items-end mb-3">
		<div>
			<h3 class="fw-bold mb-0">Worker Profile</h3>
			<div class="text-muted">Recruiter view (AI-assisted summaries)</div>
		</div>
		<a class="btn btn-outline-dark" href="javascript:history.back()">Back</a>
	</div>

	<div class="card shadow-sm">
		<div class="card-body">
			<div class="d-flex flex-wrap gap-3 align-items-center">
				<img class="rounded-circle border" style="width:86px;height:86px;object-fit:cover;"
					 th:if="${worker.selfiePath != null}" th:src="@{'/uploads/' + ${worker.selfiePath}}">
				<div>
					<div class="fw-semibold fs-5" th:text="${worker.fullName}">Name</div>
					<div class="text-muted small">
						<span th:text="${worker.barangay}">Barangay</span><span th:text="${worker.city != null ? ', ' + worker.city : ''}"></span>
					</div>
					<div class="small">
						Skill Score: <span class="fw-semibold" th:text="${worker.latestSkillScore != null ? worker.latestSkillScore : '--'}">--</span>
						<span class="mx-1">•</span>
						ID Status: <span class="fw-semibold" th:text="${worker.idVerificationStatus}">PENDING</span>
					</div>
				</div>
			</div>
			<hr class="my-3">
			<div class="small text-muted">AI-assisted Identity Verification Summary</div>
			<div class="small" th:text="${worker.idVerificationSummary}"></div>
			<hr class="my-3">
			<div class="small text-muted">ATS-ready Portfolio</div>
			<pre class="mb-0" th:if="${worker.atsPortfolio != null}" th:text="${worker.atsPortfolio}" style="white-space: pre-wrap;"></pre>
			<div class="text-muted" th:if="${worker.atsPortfolio == null}">No portfolio generated yet.</div>
		</div>
	</div>
</main>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Verify Identity - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 820px;">
	<div class="d-flex justify-content-between align-items-end mb-3">
		<div>
			<h3 class="fw-bold mb-0">AI-assisted Identity Verification</h3>
			<div class="text-muted">Uploads are used only for AI-assisted screening in this MVP.</div>
		</div>
		<a class="btn btn-outline-dark" th:href="@{/worker/dashboard}">Back</a>
	</div>

	<div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

	<div class="card shadow-sm">
		<div class="card-body">
			<form method="post" enctype="multipart/form-data">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label">Government ID Image</label>
						<input class="form-control" type="file" name="govId" accept="image/*" required>
						<div class="form-text">Supported: National ID, Driver’s License, Passport, UMID, etc.</div>
					</div>
					<div class="col-md-6">
						<label class="form-label">Selfie Photo</label>
						<input class="form-control" type="file" name="selfie" accept="image/*" required>
						<div class="form-text">Clear face photo, good lighting, no filters.</div>
					</div>
				</div>
				<button class="btn btn-dark mt-3" type="submit">Run AI-assisted Verification</button>
			</form>
			<hr class="my-3">
			<div class="small text-muted">Result: <span class="fw-semibold" th:text="${worker.idVerificationStatus}">PENDING</span></div>
			<div class="small" th:text="${worker.idVerificationSummary}"></div>
		</div>
	</div>
</main>
</body>
</html>

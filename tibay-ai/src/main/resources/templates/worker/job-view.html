<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Job - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 980px;">
	<div class="d-flex justify-content-between align-items-end mb-3">
		<div>
			<h3 class="fw-bold mb-0" th:text="${job.title}">Job</h3>
			<div class="text-muted">
				<span th:text="${job.barangay}">Barangay</span><span th:text="${job.city != null ? ', ' + job.city : ''}"></span>
				<span class="mx-1">•</span>₱<span th:text="${job.budgetPhp}">0</span>
			</div>
		</div>
		<a class="btn btn-outline-dark" th:href="@{/worker/dashboard}">Back</a>
	</div>

	<div class="row g-3">
		<div class="col-lg-7">
			<div class="card shadow-sm">
				<div class="card-body">
					<div class="small text-muted">Specialization</div>
					<div class="fw-semibold" th:text="${job.specialization}">Spec</div>
					<hr class="my-3">
					<div class="small text-muted">Description</div>
					<div class="small" style="white-space: pre-wrap;" th:text="${job.description}"></div>
					<div class="small text-muted mt-3" th:if="${job.deadline != null}">
						Deadline: <span th:text="${job.deadline}"></span>
					</div>
				</div>
			</div>
		</div>
		<div class="col-lg-5">
			<div class="card shadow-sm">
				<div class="card-body">
					<h5 class="fw-semibold">Apply</h5>
					<div class="alert alert-warning" th:if="${alreadyApplied}">You already applied for this job.</div>
					<form method="post" th:action="@{/worker/jobs/{id}/apply(id=${job.id})}" th:object="${form}">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
						<div class="mb-3">
							<label class="form-label">Cover Note (optional)</label>
							<textarea class="form-control" rows="5" th:field="*{coverNote}" placeholder="Tell the hirer your availability and relevant experience."></textarea>
							<div class="text-danger small" th:if="${#fields.hasErrors('coverNote')}" th:errors="*{coverNote}"></div>
						</div>
						<button class="btn btn-dark w-100" type="submit" th:disabled="${alreadyApplied}">Submit Application</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</main>
</body>
</html>

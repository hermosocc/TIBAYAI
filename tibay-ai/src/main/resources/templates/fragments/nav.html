<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="nav">
	<div class="container">
		<a class="navbar-brand fw-semibold" th:href="@{/}">TIBAY AI</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="nav">
			<ul class="navbar-nav me-auto mb-2 mb-lg-0">
				<li class="nav-item" sec:authorize="hasRole('WORKER')">
					<a class="nav-link" th:href="@{/worker/dashboard}">Worker</a>
				</li>
				<li class="nav-item" sec:authorize="hasRole('CLIENT')">
					<a class="nav-link" th:href="@{/client/dashboard}">Hirer</a>
				</li>
				<li class="nav-item" sec:authorize="isAuthenticated()">
					<a class="nav-link" th:href="@{/notifications}">
						Notifications <span class="badge bg-warning text-dark" th:text="${unreadNotifCount}">0</span>
					</a>
				</li>
			</ul>
			<div class="d-flex align-items-center gap-2">
				<span class="text-light small" sec:authorize="isAuthenticated()" th:text="${currentEmail}">user</span>
				<form sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}" class="m-0">
					<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
					<button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
				</form>
				<a class="btn btn-warning btn-sm" sec:authorize="!isAuthenticated()" th:href="@{/login}">Login</a>
			</div>
		</div>
	</div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head('Chat - TIBAY AI')"></head>
<body class="bg-light">
<div th:replace="fragments/nav :: nav"></div>
<main class="container py-4" style="max-width: 980px;">
	<div class="d-flex justify-content-between align-items-end mb-3">
		<div>
			<h3 class="fw-bold mb-0">Chat</h3>
			<div class="text-muted">
				<span th:text="${match.jobPost.title}">Job</span>
			</div>
		</div>
		<a class="btn btn-outline-dark" href="javascript:history.back()">Back</a>
	</div>

	<div class="card shadow-sm">
		<div class="card-body" style="height: 420px; overflow-y: auto;" id="chatBox">
			<div class="mb-2" th:each="m : ${messages}">
				<div class="small text-muted">
					<span th:text="${m.senderUser.email}">sender</span>
					<span class="mx-1">•</span>
					<span th:text="${#temporals.format(m.sentAt, 'yyyy-MM-dd HH:mm')}"></span>
				</div>
				<div class="p-2 bg-white border rounded" style="white-space: pre-wrap;" th:text="${m.body}"></div>
			</div>
			<div class="text-muted small" th:if="${#lists.isEmpty(messages)}">No messages yet.</div>
		</div>
		<div class="card-footer bg-light">
			<form method="post" th:object="${form}">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
				<div class="input-group">
					<input class="form-control" th:field="*{body}" placeholder="Type message..." autocomplete="off">
					<button class="btn btn-dark" type="submit">Send</button>
				</div>
				<div class="text-danger small" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></div>
			</form>
		</div>
	</div>
</main>
<script>
setTimeout(() => { const el = document.getElementById('chatBox'); if (el) el.scrollTop = el.scrollHeight; }, 50);
setInterval(() => { fetch(window.location.href, {headers: {'X-Requested-With':'fetch'}}).then(() => location.reload()); }, 7000);
</script>
</body>
</html>
